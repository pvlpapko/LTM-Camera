<?xml version="1.0" encoding="utf-8"?>
<LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
    android:layout_width="match_parent"
    android:layout_height="match_parent"
    android:orientation="vertical"
    android:padding="16dp">

    <TextView
        android:layout_width="wrap_content"
        android:layout_height="wrap_content"
        android:text="LowLatencyCamStreamer"
        android:textSize="24sp"
        android:textStyle="bold" />

    <Button
        android:id="@+id/btnSwitchCamera"
        android:layout_width="match_parent"
        android:layout_height="wrap_content"
        android:text="Switch Camera" />

    <Switch
        android:id="@+id/switchMic"
        android:layout_width="match_parent"
        android:layout_height="wrap_content"
        android:text="Microphone On / Off" />

    <Switch
        android:id="@+id/switchAutofocus"
        android:layout_width="match_parent"
        android:layout_height="wrap_content"
        android:text="Autofocus" />

    <SeekBar
        android:id="@+id/seekColor"
        android:layout_width="match_parent"
        android:layout_height="wrap_content"
        android:max="100" />

    <TextView
        android:layout_width="wrap_content"
        android:layout_height="wrap_content"
        android:text="RTSP/SRT &amp; Low Latency Mode" />

</LinearLayout>
